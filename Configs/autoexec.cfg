clear
// ====== Aliases ======
alias "dc" "disconnect"
alias "rr" "exec autoexec"
// ====== Scripts ======
// hold knife when key held
alias "+holdknife" "slot3"
alias "-holdknife" "lastinv"
// jump throw
alias "+jumpthrow" "+jump; -attack"
alias "-jumpthrow" "-jump"
// primary secondary toggle (Mouse5)
alias "eq_rifle" "slot1; bind mouse5 eq_pistol"
alias "eq_pistol" "slot2; bind mouse5 eq_rifle"
alias "reset_to_pistol" "bind mouse5 eq_pistol"
// nades modified layer (Mouse4 Hold)
alias "alt_q" "slot7; reset_to_pistol" // flashbang
alias "alt_e" "slot8; reset_to_pistol" // smoke
alias "alt_f" "slot10; reset_to_pistol" // molotov
alias "alt_g" "slot6; reset_to_pistol" // grenade
alias "+mod_layer" "bind q alt_q; bind e alt_e; bind f alt_f; bind g alt_g"
alias "-mod_layer" "bind q lastinv; bind e +use; bind f +lookatweapon; bind g drop"

// ====== Binds ======
bind "mouse1" "+attack"             // primary attack
bind "mouse2" "+attack2"            // secondary attack
bind "w" "+forward"                 // forward
bind "a" "+left"                    // left
bind "s" "+back"                    // back
bind "d" "+right"                   // right
bind "r" "+reload"                  // reload
bind "mwheelup" "+jump"             // jump
bind "mwheeldown" "+jump"           // jump
bind "shift" "+sprint"              // sprint
bind "ctrl" "+duck"                 // duck
bind "tab" "+showscores"            // show scorecard
bind "escape" "cancelselect"        // open/close game menu
bind "del" "sellbackall"            // sell loadout
bind "mouse3" "player_ping"         // create visual pin
bind "v" "+voicerecord"             // push to talk
bind "y" "messagemode2"             // team chat
bind "u" "messagemode"              // all chat
bind "b" "buymenu"                  // open/close buy menu
// numpad buy binds
bind "kp_divide" "buy hegrenade"
bind "kp_multiply" "buy flashbang"
bind "kp_minus" "buy smokegrenade"
bind "kp_plus" "buy incgrenade"
bind "kp_enter" "buy defuser"
bind "kp_del" "buy vest"
bind "kp_0" "buy vesthelm"
bind "kp_1" "buy secondary1"
bind "kp_2" "buy secondary2"
bind "kp_3" "buy secondary3"
bind "kp_4" "buy midtier0"
bind "kp_5" "buy midtier1"
bind "kp_6" "buy midtier2"
bind "kp_7" "buy rifle0"
bind "kp_8" "buy rifle1"
bind "kp_9" "buy rifle2"
// script binds
bind "space" "+holdknife"           // knife when key held
bind "c" "+jumpthrow"
bind "1" "slot1; bind mouse5 eq_pistol"
bind "2" "slot2; bind mouse5 eq_rifle"
bind "3" "slot3; reset_to_pistol"
bind "4" "slot4; reset_to_pistol"
bind "5" "slot5; reset_to_pistol"
bind "mouse5" "eq_rifle"            // flip between primary & secondary
bind "mouse4" "+mod_layer"          // nade secondary layer
bind "q" "lastinv"
bind "e" "+use"
bind "f" "+lookatweapon"
bind "g" "drop"

// ====== Mouse ======
sensitivity "1.484"                 // mouse sensitivity
zoom_sensitivity_ratio "0.82"       // zoom sens (matches 1:1 un-zoomed)

// ====== Crosshair ======
crosshair "1"                       // enable crosshair
cl_crosshairstyle "4"               // crosshair type (4:classic static)
cl_crosshair_recoil "0"             // follow recoil
cl_crosshairsize "1"                // crosshair lines length
cl_crosshairthickness "1"           // crosshair lines thickness
cl_crosshairgap "-4"                // crosshair lines center gap
cl_crosshairgap_useweaponvalue "0"  // dynamic gap based on weapon
cl_crosshairdot "0"                 // dot in crosshair center
cl_crosshair_t "0"                  // T style crosshair
cl_crosshair_drawoutline "0"        // draw  black outline around crosshair
cl_crosshairusealpha "1"            // enable crosshair lines transparency
cl_crosshairalpha "255"             // crosshair lines transparency value
cl_crosshaircolor "1"               // crosshair color
                                    // 0:red, 1:green, 2:yellow, 3:blue, 4:cyan, 5:custom
cl_crosshair_friendly_warning "0"   // friendly crosshair hover warning
hud_showtargetid "1"                // display name if crosshair over enemy
cl_grenadecrosshair_keepusercrosshair "0" // use normal crosshair for grenade

// ====== HUD ======
con_enable "1"                      // enable developer console
r_show_build_info "0"               // show build info in left corner
gameinstructor_enable "0"           // in-game lessons
cl_autohelp "0"                     // auto help (burst mode, etc)
cl_prefer_lefthanded "0"            // left-hand viewmodel
cl_showloadout "1"                  // always diplay current loadout
r_drawtracers_firstperson "1"       // first-person weapon tracers
cl_dm_buyrandomweapons "0"          // deathmatch random weapons
hud_scaling "1"                     // HUD scaling
cl_hud_radar_scale "1.15"           // radar scale
cl_hud_radar_background_alpha "1"   // radar background transparency
cl_hud_radar_map_additive "1"       // blend radar map additively on top of background
cl_radar_scale "0.4"                // radar interior display scale
cl_radar_icon_scale_min "0.7"       // minimum icon scale
cl_radar_always_centered "0"        // center radar around player
cl_radar_rotate "1"                 // rotate radar in player direction
cl_show_observer_crosshair "1"      // show observed player crosshair
cl_teammate_colors_show "1"         // show teammates as different colors
cl_hud_color "1"                    // HUD color
                                    // 0:team color, 1:white, 2:bright white, 3:light blue
                                    // 4:blue, 5:purple, 6:red, 7:orange, 8:yellow
                                    // 9:green, 10:aqua, 11:pink, 12:teammate color
cl_color "0"                        // preferred player color
                                    // 0:yellow, 1:purple, 2:green, 3:blue, 4:orange
cl_teamcounter_playercount_instead_of_avatars "1" // diplay player count instead of avatars
cl_weapon_selection_rarity_color "1" // weapon icons glow with their rarity color
viewmodel_presetpos "3"             // viewmodel preset
viewmodel_fov "68"                  // angle of the player vie of viewmodel
viewmodel_offset_x "1.5"            // viewmodel X axis
viewmodel_offset_y "0"              // viewmodel X axis
viewmodel_offset_z "-2"             // viewmodel X axis

// ====== Video ======
fps_max "145"                       // max FPS
fps_max_ui "60"                     // main menu max FPS

// ====== Audio ======
volume "0.5"                        // sound volume
snd_headphone_eq "0"                // EQ
snd_spatialize_lerp "0"             // directional audio
snd_menumusic_volume "0"            // main menu music
snd_menumap_volume "0"              // maps background sounds
snd_roundstart_volume "0"           // round start music
snd_roundend_volume "0"             // round end music
snd_mapobjective_volume "0"         // map objective music
snd_deathcamera_volume "0"          // death camera music
snd_tensecondwarning_volume "0.1"   // ten second warning music
snd_mvp_volume "0"                  // MVP music
snd_mute_mvp_music_live_players "1" // mute MVP music if players still alive
snd_mute_losefocus "0"              // mute sounds when game tabbed out
snd_voipvolume "0.2"                // incoming voice
cl_mute_enemy_team "1"              // mute comms from enemy team

// ====== Network ======
mm_dedicated_search_maxping "30"    // max acceptable ping
lobby_default_privacy_bits2 "1"     // default lobby permissions (0:private, 1:public)
ui_setting_advertiseforhire_auto "1" // auto advertise for invites (0:disabled, 1:last, 2:auto)
cl_predict_body_shot_fx "1"         // predict bodyshot
cl_predict_head_shot_fx "1"         // predict headshot
cl_predict_kill_ragdolls "0"        // predict kill (ragdoll)

// Misc
cl_silencer_mode "0"                // detach silencer (0:cannot detach, 1: right click)

// ====== Write Config ======
echo "==================================="
echo "   AUTOEXEC LOADED SUCCESSFULLY    "
echo "==================================="
host_writeconfig