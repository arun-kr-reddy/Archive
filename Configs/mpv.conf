profile=high-quality                 # Enables high-quality scaler presets and dithering
vo=gpu-next                          # Uses modern libplacebo-based GPU rendering pipeline
gpu-api=d3d11                        # Uses Direct3D 11 API for optimal Windows performance
hwdec=auto-safe                      # Offloads x265 10-bit video decoding to GPU
priority=high                        # Sets MPV process to high priority to avoid stutter
speed=1.5                            # Sets default playback speed to 1.5x
audio-pitch-correction=yes           # Corrects audio pitch so voices remain normal at 1.5x speed
save-position-on-quit=yes            # Automatically remembers playback position on exit
keep-open=always                     # Keeps player open after video finishes
autofit=70%                          # Default starting window size relative to screen
cursor-autohide=1000                 # Hides mouse cursor after 1 second of inactivity
volume-max=150                       # Allows software audio amplification up to 150%
alang=jpn,jap,eng,en                 # Prefers Japanese audio track first, then English (ideal for anime)
slang=eng,en,en-US                   # Automatically selects English subtitle track
sub-auto=fuzzy                       # Loads external subtitle files matching media filename
sub-file-paths=sub;subs;subtitles    # Searches specified subfolders for external subtitles
sub-ass-override=no                  # Preserves original ASS/SSA subtitle styling
sub-font="Sans Serif"                # Default subtitle font when no custom styling exists
sub-font-size=42                     # Default subtitle text size
sub-border-size=2                    # Subtitle text border outline width
sub-shadow-offset=1                  # Subtitle text drop shadow offset
screenshot-format=png                # Saves screenshots in lossless PNG format
screenshot-high-bit-depth=yes        # Preserves 10-bit source color depth in screenshots
screenshot-png-compression=8         # Sets PNG compression level for faster saves
screenshot-directory="~~desktop/"    # Saves screenshots directly to Windows Desktop
target-prim=bt.709                   # Sets target display color space (matches SDR/sRGB IPS panel)
target-trc=g2.2                      # Sets target display transfer function (Gamma 2.2 curve)
target-peak=250                      # Sets target display peak brightness in nits for tone mapping
dither-depth=8                       # Matches 8-bit monitor panel depth to eliminate color steps
dither=fruit                         # Uses spatial noise-shaped dithering
hdr-compute-peak=auto                # Enables dynamic frame-by-frame brightness calculation for HDR
tone-mapping=bt.2446a                # BT.2446a algorithm maps HDR highlights cleanly into SDR
gamut-mapping-mode=perceptual        # Preserves color relationships when compressing HDR wide gamut
scale=spline36                       # Sharp luma upscaler for low-resolution content
dscale=mitchell                      # Smooth, artifact-free downscaler when playing 4K releases on 1080p
cscale=spline36                      # High-quality chroma upscaler
video-sync=display-resample          # Resamples audio to match refresh rate (removes judder)
interpolation=no                     # Disabled (144Hz panel matches 24fps natively without blending)
deband=yes                           # Enables debanding filter to mitigate color banding
deband-iterations=1                  # Filter passes (balanced to prevent detail loss)
deband-threshold=20                  # Filter strength tuned for clean x265 encodes
deband-range=16                      # Radius around pixels to check for gradients
deband-grain=5                       # Adds slight noise to mask remaining banding without blurring
hr-seek=yes                          # Forces precise frame-accurate seeking