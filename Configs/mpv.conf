speed=1.5                           # Playback speed
save-position-on-quit=yes           # Automatically remembers playback position on exit
keep-open=always                    # Keeps player open after video finishes
volume-max=150                      # Allows software audio amplification up to 150%
slang=eng,en,en-US                  # Automatically selects English subtitle track
sub-auto=all                        # Loads external subtitle files matching media filename
sub-file-paths=sub;subs;subtitles   # Searches specified subfolders for external subtitles
sub-ass-override=no                 # Preserves original ASS/SSA subtitle styling
screenshot-format=png               # Saves screenshots in lossless PNG format
screenshot-directory="~~desktop/"   # Saves screenshots directly to Windows Desktop
vo=gpu-next                         # Uses modern libplacebo-based GPU rendering pipeline
gpu-api=d3d11                       # Uses Direct3D 11 API for optimal Windows performance
hwdec=d3d11va                       # Offloads x265 10-bit video decoding to GPU
profile=high-quality                # Enables high-quality scaler presets and dithering
video-sync=display-resample         # Resamples audio to match refresh rate (removes 24fps judder)
interpolation=yes                   # Blurs temporal frame transitions to smooth motion
tscale=oversample                   # Temporal scaling filter for motion interpolation
deband=yes                          # Enables debanding filter to mitigate color banding on 8-bit IPS
deband-iterations=2                 # Filter passes (balanced to prevent detail loss)
deband-threshold=24                 # Filter strength tuned for clean x265 encodes
deband-range=16                     # Radius around pixels to check for gradients
deband-grain=8                      # Adds slight noise to mask remaining banding without blurring
hr-seek=yes                         # Forces precise frame-accurate seeking
target-prim=bt.709                  # Sets target display color space (bt.709 matches standard SDR/sRGB monitors)
target-trc=g2.2                     # Sets target display transfer function (g2.2 applies standard Gamma 2.2 curve)
target-peak=250                     # Sets target display peak brightness in nits to calibrate tone mapping luminance range
tone-mapping=spline                 # Sets compression algorithm used to map HDR highlights into SDR range without clipping