# Core Pipeline
vo=gpu-next                            # Modern libplacebo-based GPU rendering pipeline
gpu-api=d3d11                          # Direct3D 11 API for optimal Windows performance
hwdec=auto-safe                        # Offloads HEVC 10-bit decoding to GPU

# Playback & UI
speed=1.5                              # Default playback speed set to 1.5x
save-position-on-quit=yes              # Preserves playback position on exit
keep-open=always                       # Retains player window open after video completion
autofit=70%                            # Initial window size relative to screen resolution
cursor-autohide=1000                   # Hides mouse cursor after 1000ms inactivity
volume-max=150                         # Software audio amplification cap up to 150%

# Track Selection & Subtitles
alang=jpn,jap,eng,en                   # Prefer Japanese audio track, fallback to English
slang=eng,en,en-US                     # Automatic English subtitle track selection
sub-auto=fuzzy                         # Matches external subtitle files with media filename
sub-file-paths=sub;subs;subtitles      # Search subdirectories for external subtitles
sub-font="Sans Serif"                  # Fallback subtitle font
sub-font-size=42                       # Subtitle font size
sub-border-size=2                      # Subtitle outline border width
sub-shadow-offset=1                    # Subtitle drop shadow offset

# Display & Tone Mapping (LG 24GN65R Overrides)
target-prim=bt.709                     # Forces SDR color space (bypasses display HDR EDID broadcast)
dither-depth=8                         # Matches 8-bit monitor panel depth to eliminate color steps
tone-mapping=spline                    # Uses spline curve to map HDR highlights into SDR gracefully

# Resampling & Downscaling
scale=spline36                         # High-quality luma upscaler for sub-1080p media
dscale=mitchell                        # Smooth downscaler for 4K QxR releases on 1080p display

# Screenshots
screenshot-format=png                  # Lossless PNG image format
screenshot-high-bit-depth=yes          # Retains 10-bit color depth in saved frames
screenshot-png-compression=8           # PNG compression level (balanced save speed)
screenshot-directory="~~desktop/"      # Directs saved screenshots to Windows Desktop