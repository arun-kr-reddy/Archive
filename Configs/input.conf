MBTN_LEFT       cycle pause         # Left click to toggle pause/play
MBTN_LEFT_DBL   cycle fullscreen    # Double left click to toggle fullscreen
UP              add volume 2        # Increases volume by 2%
DOWN            add volume -2       # Decreases volume by 2%
KP_ADD          add speed 0.1       # Increases playback speed by 0.1x
KP_SUBTRACT     add speed -0.1      # Decreases playback speed by 0.1x
ESC             set fullscreen no   # Exits fullscreen mode
Shift+LEFT      seek -1 exact       # Seeks backward 1 second precisely
Shift+RIGHT     seek 1 exact        # Seeks forward 1 second precisely
s               screenshot video    # Takes video-only screenshot (no subs)
Shift+s         screenshot          # Takes screenshot with subtitles and OSD