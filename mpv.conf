speed=1.5		            # Playback speed
save-position-on-quit=yes   # Automatically remembers where you left off and resumes
slang=eng,en,en-US          # Forces the player to pick the first English subtitle track
keep-open=yes               # Do not close the player window when the video ends
volume-max=150              # Allows software amplification up to 150% for quiet movie mixes
screenshot-format=png       # Saves screenshots in pristine lossless PNG format
screenshot-directory="~~desktop/" # Dumps screenshots directly onto your Windows Desktop
vo=gpu-next                 # Uses the modern, advanced video rendering engine
gpu-api=d3d11               # Best graphics API for Windows 11 performance
hwdec=d3d11va               # Fully offloads x265 10-bit decoding to your GTX 1650
profile=high-quality        # Activates high-quality scaling and dithering algorithms
dither-depth=auto           # Automatically dithers 10-bit colors down to your 8-bit IPS monitor
deband=yes                  # Enables the debanding filter
deband-iterations=4         # Better quality without destroying fine detail
deband-threshold=48         # Filter strength
deband-range=16             # Filter range
sub-auto=all                # Automatically loads external subtitles matching the video name
sub-file-paths=sub;subs;subtitles # Looks inside subfolders for subtitle files
embeddedfonts=yes           # Uses fonts embedded in the MKV for stylized subtitles
sub-ass-override=no         # Respects the original styling of advanced subtitles
audio-pitch-correction=yes  # Keeps audio sounding natural at 1.5x speed (no chipmunk effect)
hr-seek=yes                 # Uses precise seeking instead of jumping to the nearest keyframe